name: Downloadable ACP data snapshot
on:
  push:
    paths:
      - '.github/workflows/download-data-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload clean procurement CSV and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: acp-clean-data-snapshot
          path: |
            data/procurements_clean.csv
            data/quality_report.json
          retention-days: 7
          if-no-files-found: error
