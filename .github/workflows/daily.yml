name: ACP procurement daily sync
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect or collect ACP tenders"
        required: true
        type: choice
        default: collect
        options: [collect, inspect]
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '0 13 * * *' # 08:00 Panama time
permissions:
  contents: write
concurrency:
  group: acp-sli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run collector regression tests
        run: python -m unittest discover -s tests -v
      - name: Inspect portal
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect'
        run: python agent.py collect --inspect
      - name: Collect current public tenders in requested date window
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'collect'
        run: python agent.py --start 2023-11-10 collect --max-pages 100
      - name: Translate tender titles offline (record any failure)
        id: translate
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'collect'
        continue-on-error: true
        run: python translate_records.py --limit 5000
      - name: Export full database CSV
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'collect'
        run: python agent.py export
      - name: Export clean bilingual CSV and coverage report
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'collect'
        run: python export_clean.py
      - name: Show collection coverage
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'collect'
        run: python agent.py stats
      - name: Save updated data files to GitHub
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'collect'
        run: |
          git config user.name 'ACP Procurement Agent'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/procurements.sqlite data/procurements.csv data/procurements_clean.csv data/quality_report.json
          git diff --cached --quiet || (git commit -m 'Update ACP bilingual procurement data and coverage report' && git pull --rebase origin main && git push)
      - name: Upload source collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-sli-results-${{ github.run_number }}
          path: data/downloads/
          retention-days: 30
          if-no-files-found: ignore
      - name: Verify complete English translations
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'collect'
        run: python export_clean.py --require-english
